<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe de testeo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --ink:#1B2A4A;
  --accent:#2F5FD1;
  --accent-soft:#E7EDFB;
  --bg:#F5F6FA;
  --border:#DCE1EC;
  --muted:#6B7690;
  --paper:#FFFFFF;
}

*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Archivo', -apple-system, sans-serif;
  background:var(--bg);
  color:var(--ink);
  padding:24px 0 80px;
}

.toolbar{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--paper);
  border-bottom:1px solid var(--border);
  padding:14px 24px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:28px;
}
.toolbar .spacer{flex:1;}
.toolbar small{color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px;}

button{
  font-family:'Archivo',sans-serif;
  cursor:pointer;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--paper);
  color:var(--ink);
  padding:8px 14px;
  font-size:13px;
  font-weight:500;
  transition:.15s;
}
button:hover{background:var(--accent-soft); border-color:var(--accent);}
button.primary{background:#FF585C; color:#fff; border-color:#FF585C;}
button.primary:hover{background:#E84246;}
button.ghost{background:transparent; border:none; color:var(--muted); padding:4px 8px; font-size:12px;}
button.ghost:hover{color:#C0392B; background:none;}
button.small{padding:5px 10px; font-size:12px;}
.toolbar button{border-radius:999px;}
.link-btn{
  background:none;
  border:none;
  padding:2px 6px;
  color:var(--ink);
  font-weight:600;
  font-size:13px;
  border-radius:6px;
}
.link-btn:hover{background:#F0F0F0; border-color:transparent; text-decoration:none;}
.add-row button{border-radius:999px;}

.page{
  max-width:794px;
  margin:0 auto 40px;
  background:var(--paper);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:0 1px 3px rgba(20,30,60,.06);
  padding:48px 56px 40px;
  position:relative;
}

.page-toolbar{
  position:absolute;
  top:16px;
  right:16px;
  display:flex;
  gap:6px;
}

[contenteditable]{outline:none;}
[contenteditable]:focus{background:var(--accent-soft); border-radius:4px;}
[data-placeholder]:empty:before{content:attr(data-placeholder); color:#B7BECF;}

h1.doc-title{
  font-size:26px;
  font-weight:700;
  margin:0 0 4px;
  letter-spacing:-.01em;
  color:#FF585C;
}
.doc-sub{color:var(--muted); font-size:13px; margin-bottom:28px; font-family:'JetBrains Mono',monospace;}

.profile{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  background:#F7F7F7;
  border:none;
  border-radius:10px;
  padding:18px 20px;
  margin-bottom:32px;
}
.profile .field{
  border-right:1px solid var(--border);
  padding-right:14px;
}
.profile .field:last-child{
  border-right:none;
  padding-right:0;
}
.profile .field label{
  display:block;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:#000;
  font-weight:700;
  margin-bottom:4px;
}
.profile .field [contenteditable]{
  font-size:14px;
  min-height:18px;
  border-bottom:1px solid transparent;
}
.profile .field [contenteditable]:hover{border-bottom:1px solid var(--border);}
.profile .field select{
  font-family:'Archivo',sans-serif;
  font-size:14px;
  border:none;
  border-bottom:1px solid transparent;
  background:transparent;
  padding:0;
  width:100%;
  color:var(--ink);
}
.profile .field select:hover{border-bottom:1px solid var(--border);}

.section{
  margin-bottom:30px;
  padding-bottom:6px;
  page-break-inside:avoid;
}
.section-head{
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:2px solid var(--ink);
  padding-bottom:6px;
  margin-bottom:14px;
}
.section-title{
  font-size:16px;
  font-weight:700;
  flex:1;
}
.section-delete{
  width:26px;
  height:26px;
  border:none;
  background:none;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  flex-shrink:0;
  opacity:.85;
}
.section-delete:hover{opacity:1;}
.section-delete svg{display:block; width:26px; height:26px;}
.qa-row{
  margin-bottom:16px;
  display:flex;
  gap:14px;
  align-items:flex-start;
}
.qa-row .qa-main{flex:1;}
.qa-row .pregunta{
  font-weight:600;
  font-size:13.5px;
  margin-bottom:6px;
}
.qa-row .observacion{
  font-size:13px;
  min-height:38px;
  border:1px dashed var(--border);
  border-radius:6px;
  padding:8px 10px;
  color:#333;
  line-height:1.5;
  background:#F7F7F7;
}
.qa-row .row-actions{padding-top:2px;}

.task-eval{
  margin-top:6px;
  margin-bottom:18px;
  padding-top:16px;
  border-top:1px dashed var(--border);
}
.task-eval-label{
  font-weight:700;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--ink);
  margin-bottom:10px;
}
.task-chips{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.task-eval-hint{
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
}
.chip{
  border:1px solid var(--border);
  background:#fff;
  border-radius:999px;
  padding:6px 14px;
  font-size:12.5px;
  font-weight:500;
  color:var(--ink);
}
.chip:hover{background:#F7F7F7; border-color:var(--ink);}
.chip.selected{background:var(--ink); border-color:var(--ink); font-weight:600; color:#fff;}
.criticidad-widget{
  display:flex;
  align-items:center;
  gap:22px;
  background:#F7F7F7;
  border-radius:10px;
  padding:16px 20px;
}
.criticidad-score{
  flex-shrink:0;
  min-width:64px;
}
.criticidad-pct{
  font-size:30px;
  font-weight:800;
  line-height:1;
  color:var(--ink);
}
.criticidad-pct .unit{
  font-size:16px;
  font-weight:700;
  margin-left:1px;
}
.criticidad-sub{
  font-size:10.5px;
  color:var(--muted);
  margin-top:4px;
}
.criticidad-level{
  font-size:11.5px;
  font-weight:700;
  margin-top:2px;
}
.criticidad-track-wrap{
  flex:1;
  min-width:0;
}
.criticidad-zones{
  position:relative;
  height:26px;
}
.zone-label{
  position:absolute;
  top:0;
  transform:translateX(-50%);
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap;
}
.zone-label small{
  font-weight:500;
  margin-left:3px;
  font-size:9.5px;
  color:var(--muted);
}
.zone-label.alto{color:#FC2D55;}
.zone-label.medio{color:#FFA200;}
.zone-label.bajo{color:#1F31F6;}
.zone-label.nulo{color:#00D084;}
.criticidad-track{
  position:relative;
  height:8px;
  border-radius:4px;
  display:flex;
  overflow:visible;
}
.seg-alto{width:45%; background:#FC2D55; border-top-left-radius:4px; border-bottom-left-radius:4px;}
.seg-medio{width:20%; background:#FFA200;}
.seg-bajo{width:25%; background:#1F31F6;}
.seg-nulo{width:10%; background:#00D084; border-top-right-radius:4px; border-bottom-right-radius:4px;}
.criticidad-marker{
  position:absolute;
  top:50%;
  left:0%;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  border:3px solid var(--ink);
  transform:translate(-50%,-50%);
  transition:left .25s;
  box-shadow:0 1px 3px rgba(20,30,60,.2);
  cursor:grab;
  touch-action:none;
}
.criticidad-marker:active{cursor:grabbing; transition:none;}
.criticidad-marker.read-only{cursor:default;}

/* ---------- Resumen final ---------- */
.summary-page .doc-title{color:#FF585C;}
.summary-meta{
  color:var(--muted);
  font-size:13px;
  font-family:'JetBrains Mono',monospace;
  margin:-8px 0 28px;
}
.exec-summary{
  background:#F7F7F7;
  border-radius:10px;
  padding:22px 26px;
  font-size:14.5px;
  line-height:1.65;
  margin-bottom:8px;
}
.exec-summary p{margin:0 0 12px;}
.exec-summary p:last-child{margin-bottom:0;}
.exec-summary b{font-weight:700;}
.exec-stats{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:28px;
}
.exec-stat{
  flex:1;
  min-width:120px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  text-align:center;
}
.exec-stat .num{font-size:26px; font-weight:800; color:var(--ink); line-height:1;}
.exec-stat .lbl{font-size:11px; color:var(--muted); margin-top:6px;}

.task-summary{
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px 18px 4px;
  margin-bottom:16px;
}
.task-summary-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:2px;
  flex-wrap:wrap;
}
.task-summary-head .title{font-weight:700; font-size:14px;}
.compliance-chip{
  font-size:11px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.compliance-chip.ok{background:#E1F9EF; color:#00874E;}
.compliance-chip.warn{background:#FFF1D6; color:#8A5700;}
.compliance-chip.bad{background:#FFE1E6; color:#B10F30;}
.task-summary .n-count{font-size:11px; color:var(--muted); margin:2px 0 12px;}
.task-summary .criticidad-widget{background:transparent; padding:0; gap:16px;}
.task-summary .recommendation{
  font-size:12.5px;
  color:var(--ink);
  background:#F7F7F7;
  border-radius:8px;
  padding:10px 12px;
  margin:12px 0 14px;
}

.csat-summary-row{
  display:flex;
  align-items:center;
  gap:16px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 18px;
  margin-bottom:12px;
}
.csat-summary-row .avg-face{font-size:30px; line-height:1;}
.csat-summary-row .meta{flex:1;}
.csat-summary-row .meta .q{font-weight:600; font-size:13.5px; margin-bottom:4px;}
.csat-summary-row .meta .labels{font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
.csat-summary-row .avg-num{font-size:20px; font-weight:800; min-width:52px; text-align:right;}

.obs-details{
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:10px;
  overflow:hidden;
}
.obs-details summary{
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  background:#F7F7F7;
}
.obs-details .obs-list{padding:4px 14px 12px;}
.obs-details .obs-item{
  font-size:12.5px;
  padding:8px 0;
  border-top:1px solid var(--border);
}
.obs-details .obs-item:first-child{border-top:none;}
.obs-details .obs-item b{display:block; margin-bottom:2px;}
.obs-details .obs-item span{color:var(--muted);}
.empty-note{
  font-size:12.5px;
  color:var(--muted);
  font-style:italic;
  padding:10px 0;
}

.add-row{
  margin-top:4px;
  margin-bottom:32px;
  display:flex;
  justify-content:flex-end;
}

.survey-row{
  border:none;
  border-radius:10px;
  padding:16px 18px;
  margin-bottom:16px;
  position:relative;
  background:#F7F7F7;
}
.survey-row-close{
  position:absolute;
  top:8px;
  right:8px;
  width:36px;
  height:36px;
  border:none;
  background:none;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  opacity:.85;
}
.survey-row-close:hover{opacity:1;}
.survey-row-close svg{display:block; width:36px; height:36px;}
.survey-question{
  font-weight:600;
  font-size:13.5px;
  margin-bottom:12px;
}
.faces{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.face-labels-edit{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
  margin-top:8px;
}
.face-labels-edit [contenteditable]{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  min-width:60px;
}
.face-labels-edit .right{text-align:right;}
.face-btn{
  border:1px solid var(--border);
  background:#fff;
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.face-btn.selected{
  background:var(--accent);
  border-color:var(--accent);
  transform:scale(1.08);
}

.section-footer-actions{
  display:flex;
  gap:8px;
  margin-top:4px;
}

.footer-note{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:-24px;
  margin-bottom:40px;
  font-family:'JetBrains Mono',monospace;
}

/* ---------- Resumen de insights ---------- */
.summary-page .doc-title{color:#FF585C;}
.insight-section{
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px 28px;
  margin-bottom:28px;
}
.insight-section h3{
  font-size:17px;
  font-weight:700;
  margin:0 0 4px;
}
.insight-meta{
  font-size:12px;
  color:var(--muted);
  margin:0 0 16px;
}
.insight-question{
  margin-top:20px;
  padding-top:16px;
  border-top:1px dashed var(--border);
}
.insight-question .q-text{
  font-weight:600;
  font-size:13.5px;
  margin-bottom:10px;
}
.insight-question ul{
  margin:0;
  padding-left:18px;
  font-size:13px;
  line-height:1.6;
}
.insight-question ul li b{font-weight:700;}
.insight-question .empty{
  font-size:12.5px;
  color:var(--muted);
  font-style:italic;
}
.summary-textarea-wrap{
  margin-top:16px;
}
.summary-textarea-wrap textarea{
  width:100%;
  min-height:260px;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  line-height:1.5;
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  resize:vertical;
  background:#F7F7F7;
  color:#333;
}
.summary-copy-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
  flex-wrap:wrap;
}
.summary-copy-row .copied-msg{
  font-size:12px;
  color:#00A868;
  font-weight:600;
  opacity:0;
  transition:opacity .2s;
}
.summary-copy-row .copied-msg.show{opacity:1;}
.summary-empty-state{
  font-size:15px;
  color:var(--muted);
}

@media print{
  html, body, *{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    color-adjust:exact !important;
  }
  body{background:#fff; padding:0; margin:0;}
  .toolbar, .no-print{display:none !important;}
  .page{
    box-shadow:none;
    border:none;
    border-radius:0;
    max-width:none;
    margin:0;
    padding:14mm 16mm;
    page-break-after:always;
  }
  .page:last-child{page-break-after:auto;}
  [data-placeholder]:empty:before{color:transparent;}
  @page{size:A4; margin:0;}
}
</style>
</head>

<div class="toolbar no-print">
  <button class="primary" onclick="addParticipant()">+ Nuevo entrevistado</button>
  <button onclick="generateSummary()">Generar resumen</button>
  <button onclick="window.print()">Exportar a PDF</button>
  <div class="spacer"></div>
  <small>Edita el título y las secciones de la primera hoja para armar la plantilla. "+ Nuevo entrevistado" clona esa estructura en blanco para cada persona evaluada. Los datos se guardan automáticamente en este navegador.</small>
  <button class="ghost" onclick="clearSavedState()">Borrar todo</button>
</div>

<div id="pages"></div>

<script>
let sectionCounter = 0;

function uid(){ return 'id'+(Math.random().toString(36).slice(2,9)); }

// Al pegar dentro de cualquier campo editable, se pega solo el texto plano
// para que respete siempre la tipografía y el estilo del documento.
document.addEventListener('paste', function(e){
  const target = e.target.closest && e.target.closest('[contenteditable="true"]');
  if(!target) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  const selection = window.getSelection();
  if(!selection.rangeCount) return;
  selection.deleteFromDocument();
  const range = selection.getRangeAt(0);
  range.deleteContents();
  range.insertNode(document.createTextNode(text));
  range.collapse(false);
  selection.removeAllRanges();
  selection.addRange(range);
});

function makeQARow(pregunta="", observacion=""){
  const row = document.createElement('div');
  row.className = 'qa-row';
  row.innerHTML = `
    <div class="qa-main">
      <div class="pregunta" contenteditable="true" data-placeholder="Escribe la pregunta...">${pregunta}</div>
      <div class="observacion obs-field" contenteditable="true" data-placeholder="Observaciones...">${observacion}</div>
    </div>
    <div class="row-actions">
      <button class="ghost no-print" onclick="this.closest('.qa-row').remove()">✕</button>
    </div>`;
  return row;
}

function makeSection(title="Nueva sección"){
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-head">
      <div class="section-title" contenteditable="true">${title}</div>
      <button class="section-delete no-print" onclick="this.closest('.section').remove()" title="Eliminar sección"><svg width="26" height="26" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">

</svg></button>
    </div>
    <div class="qa-list"></div>
    <div class="task-eval">
      <div class="task-eval-label">Nivel de logro de la tarea</div>
      <div class="task-chips">
        <button type="button" class="chip" data-value="1" onclick="selectChip(this)">Logrado</button>
        <button type="button" class="chip" data-value="0.5" onclick="selectChip(this)">Logrado con dificultad</button>
        <button type="button" class="chip" data-value="0" onclick="selectChip(this)">No logrado</button>
      </div>
      <div class="task-eval-hint no-print">Podés arrastrar el punto sobre la barra para ajustar el porcentaje exacto.</div>

function getCriticidad(pct){
  if(pct >= 100) return {label:'Nulo',  color:'#00D084'};
  if(pct >= 70)  return {label:'Bajo',  color:'#1F31F6'};
  if(pct >= 50)  return {label:'Medio', color:'#FFA200'};
  return {label:'Alto', color:'#FC2D55'};
}

// Convierte una posición visual en la barra (0-100%) al porcentaje real,
// porque las zonas no tienen el mismo ancho que su rango real.
const CRIT_POINTS = [[0,0],[45,49],[65,69],[90,99],[100,100]];
function visualToPct(visual){
  for(let i=0;i<CRIT_POINTS.length-1;i++){
    const [v0,p0]=CRIT_POINTS[i], [v1,p1]=CRIT_POINTS[i+1];
    if(visual>=v0 && visual<=v1){
      const t=(visual-v0)/(v1-v0);
      return p0 + t*(p1-p0);
    }
  }
  return visual;
}
function pctToVisual(pct){
  for(let i=0;i<CRIT_POINTS.length-1;i++){
    const [v0,p0]=CRIT_POINTS[i], [v1,p1]=CRIT_POINTS[i+1];
    if(pct>=p0 && pct<=p1){
      const t=(pct-p0)/(p1-p0);
      return v0 + t*(v1-v0);
    }
  }
  return pct;
}

function updateCriticidadScore(taskEval, pct){
  const info = getCriticidad(pct);
  taskEval.querySelector('.criticidad-pct').innerHTML = Math.round(pct) + '<span class="unit">%</span>';
  const levelEl = taskEval.querySelector('.criticidad-level');
  levelEl.textContent = info.label;
  levelEl.style.color = info.color;
  const marker = taskEval.querySelector('.criticidad-marker');
  marker.dataset.pct = pct;
  marker.dataset.touched = '1';
}

function selectChip(btn){
  const group = btn.closest('.task-chips');
  group.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  btn.classList.add('selected');

  const taskEval = btn.closest('.task-eval');
  const pct = parseFloat(btn.dataset.value) * 100;
  updateCriticidadScore(taskEval, pct);

  const marker = taskEval.querySelector('.criticidad-marker');
  marker.style.left = pctToVisual(pct) + '%';
  marker.classList.add('active');
}

// Arrastrar el marcador para afinar el porcentaje exacto (ej: logrado pero no perfecto)
function startMarkerDrag(e){
  const marker = e.target.closest('.criticidad-marker');
  if(!marker || marker.classList.contains('read-only')) return;
  e.preventDefault();
  const track = marker.closest('.criticidad-track');
  const taskEval = marker.closest('.task-eval');

  function onMove(ev){
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const rect = track.getBoundingClientRect();
    let visual = ((clientX - rect.left) / rect.width) * 100;
    visual = Math.max(0, Math.min(100, visual));
    marker.style.left = visual + '%';
    updateCriticidadScore(taskEval, visualToPct(visual));
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchend', onUp);
    scheduleSave();
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
}
document.addEventListener('mousedown', startMarkerDrag);
document.addEventListener('touchstart', startMarkerDrag, {passive:false});

const COMPLIANCE_BY_LEVEL = {

function generateSummary(){
  const pagesEl = document.getElementById('pages');
  const existing = pagesEl.querySelector('.summary-page');
  if(existing) existing.remove();

  const participantPages = Array.from(pagesEl.querySelectorAll(':scope > .page'));
  const N = participantPages.length;
  if(N === 0){ alert('No hay hojas de entrevistados para resumir.'); return; }

  // --- 1. Recolectar tareas (secciones con task-eval) ---
  const taskMap = {}; // title -> { order, pctValues:[], questions: [{pregunta, observations:[{name,text}]}] }
  let taskOrder = 0;

  // --- 2. Recolectar encuesta CSAT (por índice de fila) ---
  const surveyMap = {}; // index -> { question, left, right, values:[] }

  participantPages.forEach(page => {
    const nameEl = page.querySelector('.profile-field');
    const name = (nameEl && nameEl.textContent.trim()) ? nameEl.textContent.trim() : 'Entrevistado sin nombre';

    // Tareas
    page.querySelectorAll('.section').forEach(section => {
      const taskEval = section.querySelector('.task-eval');
      if(!taskEval) return; // no es una sección de tarea (ej: encuesta)
      const titleEl = section.querySelector('.section-title');
      const title = titleEl ? titleEl.textContent.trim() : 'Sección sin título';
      if(!taskMap[title]) taskMap[title] = { order: taskOrder++, pctValues: [], questions: [] };
      const t = taskMap[title];

      const marker = taskEval.querySelector('.criticidad-marker');
      if(marker && marker.dataset.touched === '1'){
        t.pctValues.push(parseFloat(marker.dataset.pct));
      }

      section.querySelectorAll('.qa-row').forEach((row, qi) => {
        const preguntaEl = row.querySelector('.pregunta');
        const obsEl = row.querySelector('.observacion');
        const pregunta = preguntaEl ? preguntaEl.textContent.trim() : '';
        const obs = obsEl ? obsEl.textContent.trim() : '';
        if(!t.questions[qi]) t.questions[qi] = { pregunta: pregunta || ('Pregunta ' + (qi+1)), observations: [] };
        if(obs) t.questions[qi].observations.push({ name, text: obs });
      });
    });

    // Encuesta CSAT
    page.querySelectorAll('.survey-row').forEach((row, si) => {
      const qEl = row.querySelector('.survey-question');
      const leftEl = row.querySelector('.face-labels-edit .left');
      const rightEl = row.querySelector('.face-labels-edit .right');
      const selected = row.querySelector('.face-btn.selected');
      if(!surveyMap[si]) surveyMap[si] = {
        question: qEl ? qEl.textContent.trim() : ('Pregunta ' + (si+1)),
        left: leftEl ? leftEl.textContent.trim() : '',
        right: rightEl ? rightEl.textContent.trim() : '',
        values: []
      };
      if(selected) surveyMap[si].values.push(parseFloat(selected.dataset.value));
    });
  });

  const taskList = Object.keys(taskMap)
    .map(title => ({ title, ...taskMap[title] }))
    .sort((a,b) => a.order - b.order);

  const tasksWithData = taskList.filter(t => t.pctValues.length > 0);
  const taskAverages = tasksWithData.map(t => ({
    title: t.title,
    avg: t.pctValues.reduce((a,b)=>a+b,0) / t.pctValues.length,
    n: t.pctValues.length
  }));

  const surveyList = Object.keys(surveyMap).map(k => surveyMap[k]);
  const surveyWithData = surveyList.filter(s => s.values.length > 0)
    .map(s => ({ ...s, avg: s.values.reduce((a,b)=>a+b,0)/s.values.length }));

  // --- 3. Construir el resumen ejecutivo (basado en reglas, no en interpretación de texto libre) ---
  let execHtml = '';
  let overallPct = null, overallInfo = null;

  if(taskAverages.length === 0){
    execHtml = '<p>Todavía no hay tareas evaluadas (nadie seleccionó "Logrado / Logrado con dificultad / No logrado" ni movió el punto de criticidad en ninguna hoja). Evalúa al menos una tarea para generar el resumen ejecutivo.</p>';
  } else {
    overallPct = taskAverages.reduce((a,b)=>a+b.avg,0) / taskAverages.length;
    overallInfo = getCriticidad(overallPct);

    const byLevel = {Nulo:0, Bajo:0, Medio:0, Alto:0};
    taskAverages.forEach(t => byLevel[getCriticidad(t.avg).label]++);

    const sorted = [...taskAverages].sort((a,b)=>a.avg-b.avg);
    const weakest = sorted[0];
    const strongest = sorted[sorted.length-1];

    const verdict = (overallInfo.label === 'Alto' || overallInfo.label === 'Medio')
      ? 'En conjunto, el diseño <b>presenta problemas de usabilidad que conviene resolver</b> antes de avanzar.'
      : 'En conjunto, el diseño <b>cumple razonablemente</b> con los criterios de usabilidad evaluados.';

    execHtml += `<p>Se analizaron <b>${N} entrevistado${N===1?'':'s'}</b> sobre <b>${taskAverages.length} tarea${taskAverages.length===1?'':'s'}</b> evaluada${taskAverages.length===1?'':'s'}. El nivel de criticidad promedio general es <b style="color:${overallInfo.color}">${overallInfo.label} (${Math.round(overallPct)}%)</b>.</p>`;
    execHtml += `<p>Distribución de tareas por nivel: `;
    execHtml += ['Nulo','Bajo','Medio','Alto'].filter(l=>byLevel[l]>0).map(l=>`${byLevel[l]} en ${l}`).join(' · ');
    execHtml += `.</p>`;
    if(weakest && strongest && weakest.title !== strongest.title){
      execHtml += `<p>La tarea con <b>mayor fricción</b> fue "<b>${escapeHtml(weakest.title)}</b>" (${Math.round(weakest.avg)}% · ${getCriticidad(weakest.avg).label}). La de <b>mejor desempeño</b> fue "<b>${escapeHtml(strongest.title)}</b>" (${Math.round(strongest.avg)}% · ${getCriticidad(strongest.avg).label}).</p>`;
    }
    if(surveyWithData.length){
      const csatOverall = surveyWithData.reduce((a,b)=>a+b.avg,0)/surveyWithData.length;
      execHtml += `<p>La encuesta de satisfacción promedió <b>${csatOverall.toFixed(1)}/5</b> ${FACE_BY_VALUE[Math.round(Math.min(5,Math.max(1,csatOverall)))]}.</p>`;
    }
    execHtml += `<p>${verdict}</p>`;
  }

  // --- 4. Construir HTML de tareas ---
  let tasksHtml = '';
  taskList.forEach(t => {
    if(t.pctValues.length === 0){
      tasksHtml += `
        <div class="task-summary">
          <div class="task-summary-head"><span class="title">${escapeHtml(t.title)}</span></div>
          <p class="empty-note">Ningún entrevistado evaluó esta tarea todavía.</p>
        </div>`;
      return;
    }
    const avg = t.pctValues.reduce((a,b)=>a+b,0) / t.pctValues.length;
    const info = getCriticidad(avg);
    const comp = COMPLIANCE_BY_LEVEL[info.label];
    const obsCount = t.questions.reduce((a,q)=>a + q.observations.length, 0);

    let obsHtml = '';
    t.questions.forEach(q => {
      obsHtml += `<div class="obs-item"><b>${escapeHtml(q.pregunta)}</b>`;
      if(q.observations.length === 0){
        obsHtml += `<div class="empty-note" style="padding:2px 0;">Sin observaciones</div>`;
      } else {
        q.observations.forEach(o => {
          obsHtml += `<div><span>${escapeHtml(o.name)}:</span> ${escapeHtml(o.text)}</div>`;
        });
      }
      obsHtml += `</div>`;
    });

    tasksHtml += `
      <div class="task-summary">
        <div class="task-summary-head">
          <span class="title">${escapeHtml(t.title)}</span>
          <span class="compliance-chip ${comp.cls}">${comp.text}</span>
        </div>
        <div class="n-count">${t.pctValues.length}/${N} entrevistados evaluaron esta tarea</div>
        <div class="criticidad-widget">${buildStaticGauge(avg)}</div>
        <div class="recommendation">${RECOMMENDATION_BY_LEVEL[info.label]}</div>
        <details class="obs-details"><summary>Ver observaciones (${obsCount})</summary>
          <div class="obs-list">${obsHtml}</div>
        </details>
      </div>`;
  });

  // --- 5. Construir HTML de encuesta CSAT ---
  let csatHtml = '';
  if(surveyList.length === 0){
    csatHtml = '<p class="empty-note">No hay preguntas de encuesta configuradas.</p>';
  } else {
    surveyList.forEach(s => {
      if(s.values.length === 0){
        csatHtml += `
          <div class="csat-summary-row">
            <div class="meta"><div class="q">${escapeHtml(s.question)}</div><div class="labels">${escapeHtml(s.left)} — ${escapeHtml(s.right)}</div></div>
            <div class="empty-note">Sin respuestas</div>
          </div>`;
        return;
      }
      const avg = s.values.reduce((a,b)=>a+b,0) / s.values.length;
      const faceVal = Math.round(Math.min(5, Math.max(1, avg)));
      csatHtml += `
        <div class="csat-summary-row">
          <div class="avg-face">${FACE_BY_VALUE[faceVal]}</div>
          <div class="meta">
            <div class="q">${escapeHtml(s.question)}</div>
            <div class="labels">${escapeHtml(s.left)} — ${escapeHtml(s.right)}</div>
          </div>
          <div class="avg-num">${avg.toFixed(1)}/5</div>
        </div>`;
    });
  }

  // --- 6. Stats rápidas ---
  const csatOverallForStat = surveyWithData.length ? (surveyWithData.reduce((a,b)=>a+b.avg,0)/surveyWithData.length).toFixed(1) : '—';
  const statsHtml = `
    <div class="exec-stats">
      <div class="exec-stat"><div class="num">${N}</div><div class="lbl">Entrevistados</div></div>
      <div class="exec-stat"><div class="num">${overallPct!==null ? Math.round(overallPct)+'%' : '—'}</div><div class="lbl">Éxito promedio</div></div>
      <div class="exec-stat"><div class="num" style="color:${overallInfo?overallInfo.color:'inherit'}">${overallInfo?overallInfo.label:'—'}</div><div class="lbl">Criticidad global</div></div>
      <div class="exec-stat"><div class="num">${csatOverallForStat}${csatOverallForStat!=='—'?'/5':''}</div><div class="lbl">CSAT promedio</div></div>
    </div>`;

  const fecha = new Date().toLocaleDateString('es-CL', {day:'numeric', month:'long', year:'numeric'});

  // --- 7. Ensamblar la hoja de resumen ---
  const page = document.createElement('div');
  page.className = 'page summary-page';
  page.innerHTML = `
    <div class="page-toolbar no-print">
      <button class="ghost" onclick="removePage(this)" title="Eliminar hoja">✕</button>
    </div>
    <h1 class="doc-title">Resumen de resultados</h1>
    <div class="summary-meta">Generado el ${fecha} · ${N} entrevistado${N===1?'':'s'}</div>

    ${statsHtml}

    <div class="section">
      <div class="section-head"><div class="section-title">Resumen ejecutivo</div></div>
      <div class="exec-summary">${execHtml}</div>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Nivel de criticidad promedio por tarea</div></div>
      ${tasksHtml || '<p class="empty-note">No se encontraron tareas evaluables.</p>'}
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Encuesta de satisfacción — promedio</div></div>
      ${csatHtml}
    </div>
  `;
  pagesEl.appendChild(page);
  page.scrollIntoView({behavior:'smooth', block:'start'});
}

    page.querySelector('.survey-list').appendChild(makeSurveyRow('¿Qué tan útil te pareció esta sección?','Poco útil','Muy útil'));
  } else {
    page.innerHTML = base.innerHTML;
    // limpiar datos propios del entrevistado, mantener estructura de preguntas
    page.querySelectorAll('div.profile-field').forEach(el=>el.innerHTML='&nbsp;');
    const genderSelect = page.querySelector('.profile-gender');
    if(genderSelect) genderSelect.selectedIndex = 0;
    page.querySelectorAll('.obs-field').forEach(el=>el.innerHTML='');
    page.querySelectorAll('.face-btn').forEach(el=>el.classList.remove('selected'));
    page.querySelectorAll('.chip').forEach(el=>el.classList.remove('selected'));
    page.querySelectorAll('.criticidad-pct').forEach(el=>el.textContent='—');
    page.querySelectorAll('.criticidad-level').forEach(el=>{el.textContent=''; el.style.color='';});
    page.querySelectorAll('.criticidad-marker').forEach(el=>{el.classList.remove('active'); el.style.left='0%'; delete el.dataset.pct; delete el.dataset.touched;});
  }
  return page;
}

function addParticipant(){
  const pagesEl = document.getElementById('pages');
  const firstPage = pagesEl.querySelector('.page');
  const newPage = makeParticipantPage(firstPage);
  pagesEl.appendChild(newPage);
  newPage.scrollIntoView({behavior:'smooth', block:'start'});
}

function removePage(btn){
  const pagesEl = document.getElementById('pages');
  if(pagesEl.querySelectorAll('.page').length <= 1){
    alert('Se necesita al menos una hoja de plantilla.');
    return;
  }
  btn.closest('.page').remove();
}

// --- Autoguardado en este navegador (no envía datos a ningún servidor) ---
const STORAGE_KEY = 'bajada-testeo-autosave-v1';
let saveTimeout = null;

function scheduleSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveState, 400);
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, document.getElementById('pages').innerHTML);
  }catch(e){ /* si falla, simplemente no se guarda */ }
}

function clearSavedState(){
  if(confirm('¿Borrar todo lo escrito y empezar de cero? Esta acción no se puede deshacer.')){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

// Cualquier cambio en el contenido (texto, secciones, caritas, etc.) dispara el guardado
new MutationObserver(scheduleSave).observe(document.getElementById('pages'), {
  childList:true, subtree:true, characterData:true, attributes:true
});

// Los <select> no reflejan la opción elegida en el HTML por sí solos:
// sincronizamos el atributo "selected" para que el autoguardado los capture bien.
document.addEventListener('change', function(e){
  if(e.target.tagName === 'SELECT'){
    Array.from(e.target.options).forEach(opt => opt.selected = (opt.value === e.target.value));
    scheduleSave();
  }
});

// también guardar ante cualquier tecla dentro de campos editables
document.addEventListener('input', scheduleSave);

// --- Inicializar: restaurar si hay datos guardados, o crear la hoja plantilla ---
(function init(){
  const pagesEl = document.getElementById('pages');
  let saved = null;
  try{ saved = localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(saved && saved.trim()){
    pagesEl.innerHTML = saved;
  } else {
    pagesEl.appendChild(makeParticipantPage());
  }
})();
</script>
